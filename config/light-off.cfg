# Auto light. Included after printer.cfg while the plugin is enabled. The
# on/off switch is kept in save_variables (oc_auto_light), so it survives
# restarts and plugin updates.
[oc_light_off]

[gcode_macro OC_AUTO_LIGHT_ON]
description: Turn the chamber light on when a print starts and off when it finishes
gcode:
  SET_PIN PIN=auto_light VALUE=1

[gcode_macro OC_AUTO_LIGHT_OFF]
description: Leave the chamber light alone when a print starts or finishes
gcode:
  SET_PIN PIN=auto_light VALUE=0

# Auto light off. Included after printer.cfg while the
# plugin is enabled. The on/off switch is kept in save_variables
# (oc_light_off_on_end), so it survives restarts and plugin updates.
[oc_light_off]

[gcode_macro OC_LIGHT_OFF_ON_END_ON]
description: Turn the chamber light off when a print ends
gcode:
  SET_PIN PIN=light_off_on_end VALUE=1

[gcode_macro OC_LIGHT_OFF_ON_END_OFF]
description: Leave the chamber light on when a print ends
gcode:
  SET_PIN PIN=light_off_on_end VALUE=0
